<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lexi990 – Học từ vựng TOEIC</title>
  <meta name="description" content="Học trọn bộ 1500 từ TOEIC, 600 Essential Words và sách Từ &amp; cụm từ 0–990 với thẻ ghi nhớ lặp lại ngắt quãng, luyện tập và đề thi thử 200 câu.">
  <meta name="theme-color" content="#1E6B5C" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151A19" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Gentium+Book+Plus&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
  <link rel="stylesheet" href="assets/css/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var t = JSON.parse(localStorage.getItem('lexi990.v1') || '{}').settings;
      if (t && t.theme && t.theme !== 'auto') document.documentElement.dataset.theme = t.theme;
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#view">Bỏ qua đến nội dung</a>
  <div class="shell">
    <header class="top">
      <a class="brand" href="#/" aria-label="Lexi990, về trang hôm nay">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i class="on"></i><i></i></span>
        <span class="brand-name">Lexi<b>990</b></span>
      </a>
      <div class="top-right">
        <span class="streak" id="streak" title="Chuỗi ngày học liên tiếp"></span>
        <a class="icon-btn" href="#/settings" aria-label="Cài đặt" data-icon="gear"></a>
      </div>
    </header>

    <nav class="nav" aria-label="Điều hướng chính">
      <a href="#/" data-nav="today" data-icon="home"><span>Hôm nay</span></a>
      <a href="#/library" data-nav="library" data-icon="book"><span>Bài học</span></a>
      <a href="#/practice" data-nav="practice" data-icon="target"><span>Luyện tập</span></a>
      <a href="#/test" data-nav="test" data-icon="sheet"><span>Thi thử</span></a>
      <a href="#/dict" data-nav="dict" data-icon="search"><span>Tra từ</span></a>
    </nav>

    <main id="view" class="view" tabindex="-1">
      <noscript><p class="empty">Lexi990 cần bật JavaScript để chạy.</p></noscript>
      <p class="boot">Đang tải từ vựng…</p>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="data/words-1500.js" defer></script>
  <script src="data/words-600.js" defer></script>
  <script src="data/words-book.js" defer></script>
  <script src="data/test.js" defer></script>
  <script src="assets/js/util.js" defer></script>
  <script src="assets/js/store.js" defer></script>
  <script src="assets/js/srs.js" defer></script>
  <script src="assets/js/lexicon.js" defer></script>
  <script src="assets/js/speech.js" defer></script>
  <script src="assets/js/quiz.js" defer></script>
  <script src="assets/js/ui.js" defer></script>
  <script src="assets/js/view-today.js" defer></script>
  <script src="assets/js/view-library.js" defer></script>
  <script src="assets/js/view-study.js" defer></script>
  <script src="assets/js/view-practice.js" defer></script>
  <script src="assets/js/view-test.js" defer></script>
  <script src="assets/js/view-dict.js" defer></script>
  <script src="assets/js/view-settings.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
